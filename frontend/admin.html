
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitZone Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #222;
        }

        header {
            background: #151515;
            color: white;
            padding: 22px 30px;
        }

        header h1 {
            margin: 0;
            color: #ff5b35;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .summary {
            background: white;
            padding: 22px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px #0000000d;
        }

        .summary h2 {
            margin-top: 0;
        }

        #total {
            font-size: 32px;
            font-weight: bold;
            color: #ff5b35;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        .table-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 550px;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #202020;
            color: white;
        }

        .message {
            color: #666;
            padding: 15px 0;
        }

        .error {
            color: #c62828;
        }
    </style>
</head>

<body>
    <header>
        <h1>FitZone Gym</h1>
        <p>Admin Dashboard</p>
    </header>

    <main>
        <section class="summary">
            <h2>Total Registered Members</h2>
            <div id="total">Loading...</div>
        </section>

        <section class="table-box">
            <h2>Member Records</h2>

            <input
                type="text"
                id="search"
                placeholder="Search by name or email..."
            >

            <p id="message" class="message">Loading members...</p>

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
               <th>Email</th>
               <th>Membership Plan</th>
              <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="memberList"></tbody>
            </table>
        </section>
    </main>

    <script>
        
let members = [];

async function loadMembers() {
    const message = document.getElementById("message");

    try {
        const response = await fetch("/api/members");

        if (!response.ok) {
            throw new Error("Could not load members");
        }

        members = await response.json();

        document.getElementById("total").textContent = members.length;
        message.textContent = members.length
            ? ""
            : "No members registered yet.";
        message.classList.remove("error");

        filterMembers();
    } catch (error) {
        document.getElementById("total").textContent = "—";
        message.textContent =
            "Unable to load members. Check that the server is running.";
        message.classList.add("error");
    }
}

function displayMembers(list) {
    const tbody = document.getElementById("memberList");
    tbody.replaceChildren();

    list.forEach(member => {
        const row = document.createElement("tr");

        [member.name, member.email, member.plan].forEach(value => {
            const cell = document.createElement("td");
            cell.textContent = value || "—";
            row.appendChild(cell);
        });

        const actions = document.createElement("td");

        const editButton = document.createElement("button");
        editButton.textContent = "Edit";
        editButton.onclick = () => editMember(member);

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.style.color = "red";
        deleteButton.onclick = () => deleteMember(member.id);

        actions.append(editButton, deleteButton);
        row.appendChild(actions);
        tbody.appendChild(row);
    });
}

function filterMembers() {
    const query = document.getElementById("search").value.toLowerCase();

    const filtered = members.filter(member =>
        (member.name || "").toLowerCase().includes(query) ||
        (member.email || "").toLowerCase().includes(query)
    );

    displayMembers(filtered);
}

async function editMember(member) {
    const name = prompt("Enter member name:", member.name);
    if (name === null) return;

    const email = prompt("Enter member email:", member.email);
    if (email === null) return;

    const plan = prompt("Enter membership plan:", member.plan);
    if (plan === null) return;

    if (!name.trim() || !email.trim() || !plan.trim()) {
        alert("Please fill all fields.");
        return;
    }

    try {
        const response = await fetch(`/api/members/${member.id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                name: name.trim(),
                email: email.trim(),
                plan: plan.trim()
            })
        });

        const result = await response.json();
        if (!response.ok) throw new Error(result.message);

        alert("Member updated successfully!");
        await loadMembers();
    } catch (error) {
        alert(error.message || "Could not update member.");
    }
}

async function deleteMember(id) {
    if (!confirm("Are you sure you want to delete this member?")) return;

    try {
        const response = await fetch(`/api/members/${id}`, {
            method: "DELETE"
        });

        const result = await response.json();
        if (!response.ok) throw new Error(result.message);

        alert("Member deleted successfully!");
        await loadMembers();
    } catch (error) {
        alert(error.message || "Could not delete member.");
    }
}

document.getElementById("search").addEventListener("input", filterMembers);

loadMembers();

    </script>
</body>
</html>
