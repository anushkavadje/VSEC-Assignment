<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Result Management</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f2f2f2;
}

.container{
    width:80%;
    margin:30px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#2c3e50;
    margin-bottom:20px;
}

input{
    width:23%;
    padding:10px;
    margin:8px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    padding:10px 20px;
    background:#007BFF;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

table{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
}

table th,table td{
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}

table th{
    background:#007BFF;
    color:white;
}

.topper{
    margin-top:20px;
    padding:15px;
    background:#d4edda;
    border-left:6px solid green;
    font-size:18px;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

<h1>Student Result Management System</h1>

<input type="number" id="roll" placeholder="Roll No">

<input type="text" id="name" placeholder="Student Name">

<input type="number" id="marks" placeholder="Marks (Out of 100)">

<button onclick="addStudent()">Add Student</button>

<div class="topper" id="topper">
Topper : None
</div>

<table>

<thead>

<tr>
<th>Roll No</th>
<th>Name</th>
<th>Marks</th>
<th>Percentage</th>
</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

<script>

let students=[];

function addStudent(){

let roll=document.getElementById("roll").value;
let name=document.getElementById("name").value;
let marks=parseFloat(document.getElementById("marks").value);

if(roll=="" || name=="" || marks==""){
alert("Please fill all fields");
return;
}

let percentage=((marks/100)*100).toFixed(2);

students.push({
roll,
name,
marks,
percentage
});

displayStudents();

document.getElementById("roll").value="";
document.getElementById("name").value="";
document.getElementById("marks").value="";
}

function displayStudents(){

let body=document.getElementById("tableBody");

body.innerHTML="";

let topper=students[0];

students.forEach(student=>{

body.innerHTML+=`

<tr>

<td>${student.roll}</td>

<td>${student.name}</td>

<td>${student.marks}</td>

<td>${student.percentage}%</td>

</tr>

`;

if(student.marks>topper.marks){

topper=student;

}

});

if(students.length>0){

document.getElementById("topper").innerHTML=
`Topper : ${topper.name} (Roll No: ${topper.roll}) - ${topper.percentage}%`;

}

}

</script>

</body>
</html>
