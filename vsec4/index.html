<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>ExpenseIT</h1>
    <p>your personal Money Manager</p>

    <h2>Dashboard</h2>

    <p><strong>Current Balance:</strong> ₹<span id="balance">0</span></p>

    <p><strong>Total Income:</strong> ₹<span id="income">0</span></p>

    <p><strong>Total Expense:</strong> ₹<span id="expense">0</span></p>

    <hr>

    <h2>Add Transaction</h2>

    <label>Description</label>
    <br>
    <input type="text" id="description">

    <br>

    <label>Amount</label>
    <br>
    <input type="number" id="amount">

    <br>

    <label>Type</label>
    <br>

    <input type="radio" name="type" value="Income" checked>
    Income

    <input type="radio" name="type" value="Expense">
    Expense

    <br>

    <button onclick="addTransaction()">
        Add Transaction
    </button>

    <hr>

    <h2>Transaction History</h2>

    <ul id="transactionList">

    </ul>

    <script src="script.js"></script>

</body>

</html>
